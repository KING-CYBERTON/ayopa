{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
body{font-family:system-ui,sans-serif;max-width:34rem;margin:3rem auto;padding:0 1rem;line-height:1.5}
label{display:block;margin:1rem 0 .25rem;font-weight:600}
input,textarea,button,select{font:inherit;padding:.5rem;width:100%;box-sizing:border-box}
button{margin-top:1rem;cursor:pointer}
.err{color:#b00020}
.ok{color:#1b5e20}
.note{border-top:1px solid #ddd;padding:.75rem 0}
.note div{white-space:pre-wrap}
small{color:#666}
nav{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;font-size:.9rem}
nav a{color:#1a5fa8;text-decoration:none}
nav a:hover{text-decoration:underline}
.badge{display:inline-block;padding:.1rem .45rem;border-radius:.25rem;font-size:.75rem;font-weight:600;text-transform:uppercase}
.badge-draft{background:#f0f0f0;color:#555}
.badge-published{background:#d4edda;color:#155724}
.badge-archived{background:#ffeeba;color:#856404}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin:1rem 0}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid #eee}
th{font-weight:600;background:#f8f8f8}
tr:hover td{background:#fafafa}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.actions form{margin:0;display:inline}
.actions button{margin:0;padding:.3rem .6rem;width:auto;font-size:.85rem}
.inline-btn{display:inline;padding:.3rem .7rem;width:auto;font-size:.875rem;margin-top:0}
fieldset{border:1px solid #ddd;border-radius:.3rem;padding:.75rem;margin:1rem 0}
legend{font-weight:600;padding:0 .3rem}
.form-row{display:flex;gap:1rem}
.form-row>*{flex:1}
</style>
</head>
<body>
{{end}}
