{{define "head"}}<!doctype html>
<html lang="en" data-palette="forest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
{{template "fonts"}}
<style>
{{template "tokens"}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);background:var(--surface-page);color:var(--text-strong);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{margin:0;font-weight:800;line-height:1.2}
h1{font-size:1.6rem;letter-spacing:var(--ls-heading)}
h2{font-size:1.35rem;letter-spacing:-.02em}
p{margin:0}
a{color:var(--color-primary-text);text-decoration:none}
a:hover{text-decoration:underline;color:var(--color-primary-text)}
:focus-visible{outline:var(--focus-ring);outline-offset:2px}
code{font-family:var(--font-mono);font-size:.8rem;color:var(--text-muted)}
small,.muted{color:var(--text-muted);font-size:var(--fs-label)}

/* Admin shell: shop name, sign-in line, log out, then underline tabs */
.admin-bar{background:var(--surface-card);border-bottom:var(--border-w-hairline) solid var(--border-default)}
.admin-bar-inner{max-width:64rem;margin:0 auto;padding:1.1rem var(--gutter) 0}
.admin-id{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4);flex-wrap:wrap}
.admin-brand{display:block;font-size:1.5rem;font-weight:800;letter-spacing:var(--ls-heading);line-height:1.2;color:var(--text-strong)}
.admin-brand:hover{text-decoration:none;color:var(--color-primary-text)}
.admin-id form{margin:0}
.admin-nav{display:flex;gap:1.4rem;margin-top:var(--space-4);font-size:.9rem;overflow-x:auto}
.admin-nav a{padding:.5rem 0 .65rem;color:var(--text-muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;transition:color var(--dur-fast),border-color var(--dur-fast)}
.admin-nav a:hover{color:var(--text-strong);text-decoration:none}
.admin-nav a[aria-current="page"]{color:var(--text-strong);font-weight:700;border-bottom-color:var(--color-primary)}
.admin-nav .nav-end{margin-left:auto}

/* Layout */
.admin-main{flex:1;width:100%;max-width:64rem;margin:0 auto;padding:var(--space-7) var(--gutter) var(--space-20)}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-4)}
.back{display:inline-block;font-size:.85rem;margin-bottom:var(--space-2)}
.card{background:var(--surface-card);border:var(--border-w) solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-1);padding:1.25rem 1.4rem}
.narrow{max-width:40rem}

/* Auth pages */
.auth{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-8) var(--space-4)}
.auth-box{width:100%;max-width:var(--w-form)}
.auth-host{text-align:center;margin-bottom:var(--space-5);font-size:var(--fs-label);color:var(--text-muted);font-family:var(--font-mono)}
.auth .card{padding:var(--space-8)}
.auth .btn{width:100%;margin-top:var(--space-5);padding:.65rem}

/* Forms */
label{display:block;font-weight:600;font-size:var(--fs-label);margin:var(--space-3-5) 0 .3rem;color:var(--text-strong)}
label small{font-weight:400;margin-left:.35rem}
.hint{display:block;margin-top:var(--space-1);font-size:var(--fs-xs);color:var(--text-muted)}
input,textarea,select{display:block;width:100%;font:inherit;font-size:var(--fs-sm);line-height:1.5;padding:.45rem .65rem;border:var(--border-w) solid var(--border-default);border-radius:var(--radius-input);background:var(--surface-inset);color:var(--text-strong);transition:border-color var(--dur-base)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--color-primary)}
textarea{resize:vertical}
fieldset{border:var(--border-w-hairline) solid var(--border-default);border-radius:var(--radius-fieldset);padding:var(--space-3);margin:var(--space-4) 0}
legend{font-weight:600;padding:0 .3rem}
.form-row{display:flex;gap:var(--space-4);flex-wrap:wrap}
.form-row>*{flex:1;min-width:10rem}
.form-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:var(--space-5)}
.form-actions .back{margin:0 0 0 auto}
.inline-form{display:flex;gap:var(--space-3);align-items:center;margin:0}
.inline-form input{flex:1;min-width:8rem}
.add-form{max-width:32rem;margin-bottom:var(--space-5)}

/* Buttons (components/core/Button) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font:inherit;font-size:var(--fs-sm);font-weight:700;line-height:1.2;padding:.55rem 1.1rem;border:none;border-radius:var(--radius-input);cursor:pointer;white-space:nowrap;text-decoration:none;background:var(--color-primary);color:var(--text-on-primary);transition:background var(--dur-base),color var(--dur-base),border-color var(--dur-base)}
.btn:hover{background:var(--color-primary-strong);color:var(--text-on-primary);text-decoration:none}
.btn-secondary{background:var(--surface-card);color:var(--text-strong);border:var(--border-w) solid var(--border-default)}
.btn-secondary:hover{background:var(--surface-card);border-color:var(--color-primary);color:var(--color-primary-text)}
.btn-ghost{background:transparent;color:var(--text-muted)}
.btn-ghost:hover{background:var(--color-primary-soft);color:var(--color-primary-text)}
.btn-danger{background:var(--color-danger);color:#fff}
.btn-danger:hover{background:var(--color-danger);color:#fff;filter:brightness(.92)}
.btn-sm{padding:.3rem .7rem;font-size:.8125rem}
.star{border:none;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:.2rem;color:var(--text-muted)}
.star.on{color:#d97706}

/* Notices (components/core/Notice) */
.err,.ok{margin:var(--space-2) 0 var(--space-4);padding:.5rem .875rem;font-size:var(--fs-sm);border-left:3px solid;border-radius:0 .4rem .4rem 0}
.err{color:var(--color-danger);background:var(--color-danger-soft)}
.ok{color:var(--color-success);background:var(--color-primary-soft)}

/* Status badges (components/core/Badge) */
.badge{display:inline-block;padding:.1rem .45rem;border-radius:var(--radius-sm);font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.5}
.badge-draft{background:var(--status-draft-bg);color:var(--status-draft-fg)}
.badge-published{background:var(--status-published-bg);color:var(--status-published-fg)}
.badge-archived{background:var(--status-archived-bg);color:var(--status-archived-fg)}

/* Filter chips (components/core/Chip) */
.chips{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:0 0 var(--space-4)}
.eyebrow{font-size:var(--fs-eyebrow);font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-right:.2rem}
.chips a{font-size:var(--fs-label);line-height:1.5;padding:.25rem .7rem;border:var(--border-w) solid var(--border-default);border-radius:var(--radius-pill);color:var(--text-strong);transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
.chips a:hover,.chips a[aria-current="page"]{background:var(--color-primary);border-color:var(--color-primary);color:#fff;text-decoration:none}

/* Tables (components/data/DataTable) */
.table-wrap{background:var(--surface-card);border:var(--border-w) solid var(--border-default);border-radius:var(--radius-card);overflow:auto}
table{width:100%;min-width:40rem;border-collapse:collapse;font-size:var(--fs-sm)}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:var(--border-w-hairline) solid var(--border-default);vertical-align:middle}
th{font-weight:600;font-size:var(--fs-eyebrow);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);background:var(--surface-inset);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-inset)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-title{font-weight:600}
.cell-sub{display:block;font-size:var(--fs-xs);color:var(--text-muted)}
.stock-out{color:var(--color-danger)}
.stock-low{font-weight:600}
.actions{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.actions form{margin:0}

/* Confirm-before-delete without JavaScript (the CSP blocks scripts) */
details.confirm{position:relative}
details.confirm summary{list-style:none}
details.confirm summary::-webkit-details-marker{display:none}
details.confirm[open] .confirm-pop{display:flex}
.confirm-pop{display:none;position:absolute;right:0;top:calc(100% + .35rem);z-index:5;flex-direction:column;gap:var(--space-2);width:15rem;padding:var(--space-3);background:var(--surface-card);border:var(--border-w) solid var(--border-default);border-radius:var(--radius-note);box-shadow:var(--shadow-2);font-size:var(--fs-xs);color:var(--text-muted)}
.confirm-pop form{margin:0}
.confirm-pop .btn{width:100%}

/* Pager */
.pager{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-top:var(--space-4);font-size:var(--fs-sm);color:var(--text-muted)}

/* Notes */
.notes{list-style:none;margin:var(--space-4) 0 0;padding:0}
.notes li{padding:var(--space-3) 0;border-top:var(--border-w-hairline) solid var(--border-default)}
.notes .body{white-space:pre-wrap}
.notes small{font-size:var(--fs-xs)}

/* Empty states */
.empty{text-align:center;padding:var(--space-8) var(--space-4);color:var(--text-muted)}
.empty .btn{margin-top:var(--space-4)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
{{end}}

{{define "admin_bar"}}<header class="admin-bar">
  <div class="admin-bar-inner">
    <div class="admin-id">
      <div>
        <a href="/admin" class="admin-brand">{{.Shop}}</a>
        <small>Signed in as {{.UserEmail}} ({{.Role}}) in {{.MallName}}</small>
      </div>
      <form method="post" action="/admin/logout"><button class="btn btn-secondary btn-sm" type="submit">Log out</button></form>
    </div>
    <nav class="admin-nav" aria-label="Admin">
      <a href="/admin"{{if eq .Page "dashboard"}} aria-current="page"{{end}}>Dashboard</a>
      <a href="/admin/products"{{if eq .Page "admin_products" "admin_product_form"}} aria-current="page"{{end}}>Products</a>
      <a href="/admin/categories"{{if eq .Page "admin_categories"}} aria-current="page"{{end}}>Categories</a>
      {{if eq .Role "owner"}}<a href="/admin/settings"{{if eq .Page "admin_settings"}} aria-current="page"{{end}}>Settings</a>{{end}}
      <a class="nav-end" href="/" target="_blank" rel="noopener">View shop &#8599;</a>
    </nav>
  </div>
</header>
{{end}}

{{define "fonts"}}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
{{end}}
