{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
<style>
{{template "tokens"}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-md);line-height:1.55;background:var(--color-bg);color:var(--color-text);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{line-height:1.2;letter-spacing:-.02em;margin:0}
h1{font-size:var(--text-xl);font-weight:800}
h2{font-size:var(--text-lg);font-weight:700}
p{margin:0}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
code{font-family:var(--font-mono);font-size:.85em;background:var(--color-surface-2);padding:.1rem .35rem;border-radius:var(--radius-sm)}
small,.muted{color:var(--color-muted);font-size:var(--text-sm)}

/* Top bar */
.admin-bar{background:var(--color-surface);border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:10}
.admin-bar-inner{max-width:72rem;margin:0 auto;padding:var(--space-3) clamp(1rem,4vw,2rem);display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.admin-brand{font-weight:800;font-size:1.05rem;color:var(--color-text);letter-spacing:-.02em;margin-right:auto}
.admin-brand:hover{text-decoration:none;color:var(--color-primary)}
.admin-nav{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap}
.admin-nav a{flex-shrink:0;white-space:nowrap;color:var(--color-muted);font-size:var(--text-sm);font-weight:600;padding:.4rem .8rem;border-radius:var(--radius-full)}
.admin-nav a:hover{color:var(--color-text);background:var(--color-surface-2);text-decoration:none}
.admin-nav a[aria-current="page"]{color:var(--color-primary);background:var(--color-primary-soft)}
.admin-user{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);color:var(--color-muted)}
.admin-user form{margin:0}

/* Layout */
.admin-main{flex:1;width:100%;max-width:72rem;margin:0 auto;padding:var(--space-8) clamp(1rem,4vw,2rem)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
.page-head p{margin-top:var(--space-1)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-6)}
.card+.card{margin-top:var(--space-6)}
.card>h2{margin-bottom:var(--space-4)}
.stack>*+*{margin-top:var(--space-4)}
.narrow{max-width:40rem}

/* Auth pages */
.auth{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-8) var(--space-4)}
.auth .card{width:100%;max-width:26rem;padding:var(--space-8)}
.auth .eyebrow{font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-primary);margin-bottom:var(--space-2)}
.auth h1{margin-bottom:var(--space-6)}
.auth .btn{width:100%;margin-top:var(--space-6)}

/* Forms */
label{display:block;font-weight:600;font-size:var(--text-sm);margin:var(--space-4) 0 var(--space-1)}
label small{font-weight:400}
.hint{display:block;margin-top:var(--space-1);font-size:var(--text-xs);color:var(--color-muted)}
input,textarea,select{font:inherit;font-size:var(--text-sm);width:100%;padding:.55rem .75rem;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-soft)}
textarea{resize:vertical}
fieldset{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2) var(--space-4) var(--space-4);margin:0 0 var(--space-4)}
legend{font-weight:700;font-size:var(--text-sm);padding:0 var(--space-2)}
.form-row{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(10rem,1fr))}
.form-actions{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-6)}
.inline-form{display:flex;gap:var(--space-2);align-items:center;margin:0}
.inline-form input{width:auto;flex:1;min-width:8rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font:inherit;font-size:var(--text-sm);font-weight:700;padding:.55rem 1.1rem;border-radius:var(--radius-sm);border:1.5px solid transparent;cursor:pointer;white-space:nowrap;background:var(--color-primary);color:var(--color-on-primary);transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--color-primary-hover);text-decoration:none}
.btn-secondary{background:var(--color-surface);color:var(--color-text);border-color:var(--color-border)}
.btn-secondary:hover{background:var(--color-surface-2);border-color:var(--color-muted)}
.btn-ghost{background:transparent;color:var(--color-muted)}
.btn-ghost:hover{background:var(--color-surface-2);color:var(--color-text)}
.btn-danger{background:var(--color-danger);color:#fff}
.btn-danger:hover{background:var(--color-danger);filter:brightness(.9)}
.btn-sm{padding:.3rem .65rem;font-size:var(--text-xs)}
.btn-icon{padding:.3rem .5rem;font-size:1rem;line-height:1}
.btn-icon.on{color:var(--color-warning)}

/* Notices */
.err,.ok{font-size:var(--text-sm);padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);border-left:3px solid;margin-bottom:var(--space-4)}
.err{color:var(--color-danger);background:var(--color-danger-soft)}
.ok{color:var(--color-success);background:var(--color-success-soft)}

/* Badges */
.badge{display:inline-block;padding:.15rem .55rem;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:700;text-transform:capitalize}
.badge-draft{background:var(--color-surface-2);color:var(--color-muted)}
.badge-published{background:var(--color-success-soft);color:var(--color-success)}
.badge-archived{background:var(--color-warning-soft);color:var(--color-warning)}

/* Filter tabs */
.tabs{display:flex;gap:var(--space-1);flex-wrap:wrap;margin-bottom:var(--space-4)}
.tabs a{font-size:var(--text-sm);font-weight:600;color:var(--color-muted);padding:.35rem .85rem;border:1.5px solid var(--color-border);border-radius:var(--radius-full)}
.tabs a:hover{color:var(--color-text);text-decoration:none;border-color:var(--color-muted)}
.tabs a[aria-current="page"]{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}

/* Tables */
.table-wrap{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow-x:auto}
table{width:100%;min-width:40rem;border-collapse:collapse;font-size:var(--text-sm)}
th,td{text-align:left;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border);vertical-align:middle}
th{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-muted);background:var(--color-surface-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--color-surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-title{font-weight:700;color:var(--color-text)}
.cell-sub{display:block;font-size:var(--text-xs);color:var(--color-muted)}
.actions{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.actions form{margin:0}

/* Confirm-before-delete without JavaScript (the CSP blocks scripts) */
details.confirm{position:relative}
details.confirm summary{list-style:none}
details.confirm summary::-webkit-details-marker{display:none}
details.confirm[open] .confirm-pop{display:flex}
.confirm-pop{display:none;position:absolute;right:0;top:calc(100% + .35rem);z-index:5;flex-direction:column;gap:var(--space-2);width:15rem;padding:var(--space-3);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);font-size:var(--text-xs);color:var(--color-muted)}
.confirm-pop form{margin:0}
.confirm-pop .btn{width:100%}

/* Pager */
.pager{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-top:var(--space-4);font-size:var(--text-sm);color:var(--color-muted)}

/* Notes */
.notes{list-style:none;margin:var(--space-4) 0 0;padding:0}
.notes li{padding:var(--space-4) 0;border-top:1px solid var(--color-border)}
.notes .body{white-space:pre-wrap}
.notes small{display:block;margin-top:var(--space-1);font-size:var(--text-xs)}

/* Empty states */
.empty{text-align:center;padding:var(--space-8) var(--space-4);color:var(--color-muted)}
.empty p+.btn{margin-top:var(--space-4)}

@media(max-width:40rem){
  .admin-bar{position:static}
  .admin-brand{flex-basis:100%}
  .admin-nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:var(--space-1)}
  .admin-user{margin-left:auto}
  .admin-user span{max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .admin-main{padding-top:var(--space-6)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
{{end}}

{{define "admin_bar"}}<header class="admin-bar">
  <div class="admin-bar-inner">
    <a href="/admin" class="admin-brand">{{.Shop}}</a>
    <nav class="admin-nav" aria-label="Admin">
      <a href="/admin"{{if eq .Page "dashboard"}} aria-current="page"{{end}}>Dashboard</a>
      <a href="/admin/products"{{if eq .Page "admin_products" "admin_product_form"}} aria-current="page"{{end}}>Products</a>
      <a href="/admin/categories"{{if eq .Page "admin_categories"}} aria-current="page"{{end}}>Categories</a>
      {{if eq .Role "owner"}}<a href="/admin/settings"{{if eq .Page "admin_settings"}} aria-current="page"{{end}}>Settings</a>{{end}}
      <a href="/" target="_blank" rel="noopener">View shop &#8599;</a>
    </nav>
    <div class="admin-user">
      <span title="{{.Role}}">{{.UserEmail}}</span>
      <form method="post" action="/admin/logout"><button class="btn btn-secondary btn-sm" type="submit">Log out</button></form>
    </div>
  </div>
</header>
{{end}}
