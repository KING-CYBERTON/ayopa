{{define "shop_head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Noindex}}<meta name="robots" content="noindex,follow">{{end}}
<title>{{.Title}}</title>
{{if .MetaDesc}}<meta name="description" content="{{.MetaDesc}}">{{end}}
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#15803D;--pd:#14532D;--pl:#F0FDF4;
  --a:#0369A1;--ad:#075985;
  --bg:#F9FAFB;--card:#fff;
  --fg:#111827;--muted:#6B7280;
  --border:#E5E7EB;--border2:#BBF7D0;
  --danger:#DC2626;--ok:#16A34A;
  --sh:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --sh2:0 4px 12px rgba(0,0,0,.1),0 8px 32px rgba(0,0,0,.07)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0A1A0F;--card:#0F2118;
  --fg:#F0FDF4;--muted:#86EFAC;
  --border:#1C3828;--border2:#14532D;
  --sh:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --sh2:0 4px 12px rgba(0,0,0,.6),0 8px 32px rgba(0,0,0,.5)
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
a{text-decoration:none;color:var(--p)}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:2px}
img{max-width:100%;height:auto}

/* Nav */
.site-nav{background:var(--pd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.75rem clamp(1rem,5vw,3rem);gap:1rem;flex-wrap:wrap}
.site-nav .brand{font-weight:800;font-size:1.1rem;color:#fff;letter-spacing:-.02em}
.site-nav .brand:hover{opacity:.9;text-decoration:none}
.site-nav .brand:focus-visible{outline-color:#fff}
.site-nav .nav-links{display:flex;gap:1rem;align-items:center;font-size:.875rem;flex-wrap:wrap}
.site-nav .nav-links a{color:rgba(255,255,255,.78);transition:color .12s}
.site-nav .nav-links a:hover{color:#fff;text-decoration:none}
.site-nav .nav-links a:focus-visible{outline-color:#fff}

/* Shop hero */
.shop-hero{background:linear-gradient(140deg,var(--pd) 0%,var(--p) 100%);color:#fff;text-align:center;padding:clamp(2.5rem,7vw,5.5rem) clamp(1rem,6vw,4rem)}
.shop-hero h1{font-size:clamp(1.85rem,4vw+.5rem,3.75rem);font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-bottom:.5rem}
.shop-hero .tagline{font-size:clamp(.95rem,1.5vw+.2rem,1.3rem);opacity:.85;font-style:italic;line-height:1.45}
.shop-hero .cta{display:inline-block;background:#fff;color:var(--pd);padding:.55rem 1.6rem;border-radius:100px;font-size:.9rem;font-weight:700;margin-top:1.5rem;transition:background .15s}
.shop-hero .cta:hover{background:var(--pl);text-decoration:none}

/* Featured strip */
.featured{max-width:82rem;margin:0 auto;padding:2.5rem clamp(1rem,4vw,3rem) 0}
.featured h2{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem}
.featured-grid{display:grid;gap:.875rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,11.5rem),1fr))}

/* Catalog layout */
.catalog-wrap{max-width:82rem;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem);display:grid;gap:1.75rem;grid-template-columns:1fr}
@media(min-width:48rem){.catalog-wrap{grid-template-columns:15.5rem 1fr}}

/* Filter sidebar */
.filter-form{background:var(--card);border:1.5px solid var(--border);border-radius:.875rem;padding:1.4rem;font-size:.875rem;position:sticky;top:1rem;align-self:start;box-shadow:var(--sh)}
.filter-form h2{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem}
.filter-form label{display:block;font-weight:600;font-size:.8rem;margin:.875rem 0 .3rem;color:var(--fg)}
.filter-form input,.filter-form select{width:100%;padding:.45rem .65rem;font:inherit;border:1.5px solid var(--border);border-radius:.45rem;background:var(--bg);color:var(--fg);font-size:.85rem;transition:border-color .15s}
.filter-form input:focus,.filter-form select:focus{outline:none;border-color:var(--p)}
.filter-form .price-row{display:flex;gap:.5rem}
.filter-form .price-row input{width:0;flex:1}
.filter-form .checkbox-row{display:flex;align-items:center;gap:.5rem;margin:.875rem 0}
.filter-form .checkbox-row input{width:auto;accent-color:var(--p)}
.filter-btn{display:block;width:100%;margin-top:1rem;padding:.55rem;background:var(--p);color:#fff;border:none;border-radius:.45rem;font:inherit;font-weight:700;cursor:pointer;font-size:.875rem;transition:background .15s}
.filter-btn:hover{background:var(--pd)}
.filter-clear{display:block;text-align:center;margin-top:.5rem;font-size:.8rem;color:var(--muted)}

/* Sort bar */
.sort-bar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem;font-size:.8rem}
.sort-bar span{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sort-bar a{padding:.25rem .7rem;border:1.5px solid var(--border);border-radius:100px;color:var(--fg);transition:background .12s,border-color .12s,color .12s}
.sort-bar a.active,.sort-bar a:hover{background:var(--p);color:#fff;border-color:var(--p);text-decoration:none}

/* Product grid */
.product-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.product-card{background:var(--card);border:1.5px solid var(--border);border-radius:.875rem;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:var(--sh)}
.product-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--border2)}
.product-card a{text-decoration:none;color:var(--fg);display:flex;flex-direction:column;flex:1}
.product-card a:hover{text-decoration:none}
.pcard-thumb{height:11rem;display:flex;align-items:center;justify-content:center;font-size:3.5rem;font-weight:800;color:#fff;user-select:none;flex-shrink:0}
.pcard-body{padding:.9rem 1rem;flex:1;display:flex;flex-direction:column;gap:.2rem}
.pcard-name{font-weight:700;font-size:.95rem;line-height:1.35;color:var(--fg)}
.pcard-price{font-size:1.05rem;font-weight:800;color:var(--p);font-variant-numeric:tabular-nums;margin-top:.1rem}
.pcard-stock{font-size:.75rem;font-weight:600;color:var(--danger);margin-top:.2rem}
.pcard-nostock{font-size:.75rem;color:var(--muted);margin-top:.2rem}

/* Pagination */
.pagination{display:flex;gap:.375rem;flex-wrap:wrap;align-items:center;margin-top:2rem;font-size:.875rem}
.pagination a,.pagination span{padding:.3rem .65rem;border:1.5px solid var(--border);border-radius:.45rem;color:var(--fg);min-width:2.25rem;text-align:center;transition:background .12s,border-color .12s,color .12s}
.pagination a:hover{background:var(--p);color:#fff;border-color:var(--p);text-decoration:none}
.pagination .cur{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}
.pagination .dots{border-color:transparent;color:var(--muted)}
.pager-info{font-size:.8rem;color:var(--muted);margin-top:.5rem}

/* Empty state */
.empty-state{text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty-state p{font-size:1.05rem;margin-bottom:1rem}
.empty-state a{color:var(--p)}

/* Product detail */
.product-detail{max-width:58rem;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem)}
.detail-breadcrumb{font-size:.85rem;color:var(--muted);margin-bottom:2rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.detail-breadcrumb a{color:var(--muted)}
.detail-breadcrumb a:hover{color:var(--p);text-decoration:none}
.detail-breadcrumb .sep{color:var(--border);font-size:1.1rem}
.detail-layout{display:grid;gap:2.5rem;grid-template-columns:1fr}
@media(min-width:42rem){.detail-layout{grid-template-columns:1.1fr 1fr}}
.detail-image{border-radius:1rem;overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:6rem;font-weight:800;color:#fff;user-select:none;min-height:14rem}
.detail-info{}
.product-detail h1{font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:.5rem}
.detail-price{font-size:2.1rem;font-weight:800;color:var(--p);font-variant-numeric:tabular-nums;margin:1rem 0}
.detail-meta{font-size:.85rem;color:var(--muted);display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.detail-badge{background:var(--pl);color:var(--pd);padding:.2rem .65rem;border-radius:100px;font-weight:600;font-size:.8rem}
.detail-desc{white-space:pre-line;margin:1.25rem 0;line-height:1.75;color:var(--fg)}
.detail-stock{font-size:.9rem;font-weight:600;color:var(--danger);margin:.5rem 0}
.detail-instock{font-size:.9rem;font-weight:600;color:var(--ok);margin:.5rem 0}
.add-cart-note{background:var(--pl);border:1.5px solid var(--border2);border-radius:.75rem;padding:1rem 1.25rem;font-size:.9rem;color:var(--pd);margin-top:1.75rem;line-height:1.55}
.add-cart-note a{color:var(--a)}
.detail-cat{font-size:.875rem;color:var(--muted)}

/* Shop info bar */
.shop-info{background:var(--card);border-top:2px solid var(--border);padding:1.5rem clamp(1rem,5vw,3rem);font-size:.875rem;color:var(--muted);display:flex;gap:1.75rem;flex-wrap:wrap}
.shop-info a{color:var(--a)}
.shop-info strong{color:var(--fg)}

/* Notices */
.err{color:var(--danger);font-size:.875rem;margin:.5rem 0;padding:.5rem .875rem;background:#FEF2F2;border-left:3px solid var(--danger);border-radius:0 .4rem .4rem 0}
.ok{color:var(--ok);font-size:.875rem;margin:.5rem 0;padding:.5rem .875rem;background:var(--pl);border-left:3px solid var(--ok);border-radius:0 .4rem .4rem 0}

/* Footer */
.site-footer{border-top:1px solid var(--border);padding:1.25rem clamp(1rem,5vw,3rem);text-align:center;font-size:.8rem;color:var(--muted)}
.site-footer a{color:var(--muted)}
.site-footer a:hover{color:var(--p);text-decoration:none}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
{{end}}
