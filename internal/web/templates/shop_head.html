{{define "shop_head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Noindex}}<meta name="robots" content="noindex,follow">{{end}}
<title>{{.Title}}</title>
{{if .MetaDesc}}<meta name="description" content="{{.MetaDesc}}">{{end}}
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--border:#ddd;--accent:#1a5fa8;--accent2:#0f3d72;--card:#f7f8fb;--hero-bg:#eef2fa;--danger:#b00020;--ok:#1b5e20}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--muted:#999;--border:#2a2a2a;--accent:#6ba8e5;--accent2:#9ec5f0;--card:#1a1a1a;--hero-bg:#161a22;--danger:#ff6b6b;--ok:#6dd56d}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
img{max-width:100%;height:auto}
/* Nav */
.site-nav{background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:.6rem clamp(1rem,5vw,3rem);gap:1rem;flex-wrap:wrap}
.site-nav .brand{font-weight:700;font-size:1.1rem;color:var(--bg);text-decoration:none}
.site-nav .nav-links{display:flex;gap:1.25rem;align-items:center;font-size:.9rem}
.site-nav .nav-links a{color:var(--bg);opacity:.85}
.site-nav .nav-links a:hover{opacity:1;text-decoration:none}
.site-nav .cart-link{background:var(--accent);color:#fff;padding:.3rem .8rem;border-radius:.3rem;font-weight:600;opacity:1}
.site-nav .cart-link:hover{background:var(--accent2)}
/* Hero */
.shop-hero{background:var(--hero-bg);padding:clamp(2rem,6vw,5rem) clamp(1rem,6vw,4rem);text-align:center}
.shop-hero h1{font-size:clamp(1.75rem,4vw + .5rem,3rem);font-weight:700;letter-spacing:-.02em;margin-bottom:.5rem}
.shop-hero .tagline{font-size:clamp(1rem,1.5vw + .3rem,1.3rem);color:var(--muted);font-style:italic;margin-bottom:1.25rem}
.shop-hero .cta{display:inline-block;background:var(--accent);color:#fff;padding:.65rem 1.75rem;border-radius:.35rem;font-weight:600;font-size:1rem}
.shop-hero .cta:hover{background:var(--accent2);text-decoration:none}
/* Featured strip */
.featured{max-width:80rem;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem)}
.featured h2{font-size:1.1rem;font-weight:600;margin-bottom:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.featured-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr))}
/* Catalog layout */
.catalog-wrap{max-width:80rem;margin:0 auto;padding:1.5rem clamp(1rem,4vw,3rem);display:grid;gap:1.5rem;grid-template-columns:1fr}
@media(min-width:48rem){.catalog-wrap{grid-template-columns:14rem 1fr}}
/* Filter */
.filter-form{background:var(--card);border:1px solid var(--border);border-radius:.5rem;padding:1.25rem;font-size:.875rem}
.filter-form h2{font-size:.9rem;font-weight:700;margin-bottom:1rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.filter-form label{display:block;font-weight:600;margin:.75rem 0 .2rem;font-size:.85rem}
.filter-form input,.filter-form select{width:100%;padding:.4rem .5rem;font:inherit;border:1px solid var(--border);border-radius:.3rem;background:var(--bg);color:var(--fg);font-size:.875rem}
.filter-form .price-row{display:flex;gap:.5rem}
.filter-form .price-row input{width:0;flex:1}
.filter-form .checkbox-row{display:flex;align-items:center;gap:.5rem;margin:.75rem 0}
.filter-form .checkbox-row input{width:auto}
.filter-btn{display:block;width:100%;margin-top:.75rem;padding:.5rem;background:var(--accent);color:#fff;border:none;border-radius:.3rem;font:inherit;font-weight:600;cursor:pointer;font-size:.875rem}
.filter-btn:hover{background:var(--accent2)}
.filter-clear{display:block;text-align:center;margin-top:.5rem;font-size:.8rem;color:var(--muted)}
/* Sort bar */
.sort-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.875rem}
.sort-bar span{color:var(--muted)}
.sort-bar a{padding:.25rem .6rem;border:1px solid var(--border);border-radius:.3rem;color:var(--fg)}
.sort-bar a.active,.sort-bar a:hover{background:var(--accent);color:#fff;border-color:var(--accent);text-decoration:none}
/* Product grid */
.product-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,14rem),1fr))}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:.5rem;overflow:hidden;display:flex;flex-direction:column}
.product-card a{text-decoration:none;color:var(--fg)}
.product-card a:hover .pcard-name{text-decoration:underline}
.pcard-thumb{height:9rem;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700;color:#fff;user-select:none}
.pcard-body{padding:.75rem;flex:1;display:flex;flex-direction:column;gap:.25rem}
.pcard-name{font-weight:600;font-size:.95rem;line-height:1.3}
.pcard-price{font-size:.95rem;font-weight:700}
.pcard-stock{font-size:.75rem;color:var(--danger)}
.pcard-nostock{font-size:.75rem;color:var(--muted)}
/* Pagination */
.pagination{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:1.5rem;font-size:.875rem}
.pagination a,.pagination span{padding:.3rem .6rem;border:1px solid var(--border);border-radius:.3rem;color:var(--fg);min-width:2rem;text-align:center}
.pagination a:hover{background:var(--accent);color:#fff;border-color:var(--accent);text-decoration:none}
.pagination .cur{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.pagination .dots{border:none;color:var(--muted)}
.pager-info{font-size:.85rem;color:var(--muted);margin-top:.5rem}
/* Empty state */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state p{margin-bottom:1rem}
/* Product detail */
.product-detail{max-width:52rem;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem)}
.product-detail h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;margin-bottom:.5rem}
.detail-price{font-size:1.5rem;font-weight:700;margin:1rem 0}
.detail-meta{font-size:.875rem;color:var(--muted);margin-bottom:1rem;display:flex;gap:1rem;flex-wrap:wrap}
.detail-desc{white-space:pre-line;margin:1rem 0;line-height:1.7}
.detail-stock{font-size:.875rem;color:var(--danger);margin:.5rem 0}
.detail-cat{font-size:.875rem;color:var(--muted)}
.add-cart-note{font-size:.875rem;color:var(--muted);font-style:italic;margin-top:1rem}
/* Shop info */
.shop-info{background:var(--card);border-top:1px solid var(--border);padding:1.5rem clamp(1rem,5vw,3rem);font-size:.875rem;color:var(--muted);display:flex;gap:1.5rem;flex-wrap:wrap}
.shop-info a{color:var(--muted)}
.shop-info strong{color:var(--fg)}
/* Notices */
.err{color:var(--danger);font-size:.9rem;margin:.5rem 0}
.ok{color:var(--ok);font-size:.9rem;margin:.5rem 0}
/* Footer */
.site-footer{border-top:1px solid var(--border);padding:1rem clamp(1rem,5vw,3rem);text-align:center;font-size:.8rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
{{end}}
