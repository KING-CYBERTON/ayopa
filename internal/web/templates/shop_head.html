{{define "shop_head"}}<!doctype html>
<html lang="en" data-palette="{{or .Palette "forest"}}" data-style="{{or .Style "classic"}}"{{if eq .Theme "light" "dark"}} data-theme="{{.Theme}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Noindex}}<meta name="robots" content="noindex,follow">{{end}}
<title>{{.Title}}</title>
{{if .MetaDesc}}<meta name="description" content="{{.MetaDesc}}">{{end}}
{{template "fonts"}}{{if eq .Style "boutique"}}{{template "serif_font"}}{{end}}
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
{{template "tokens"}}
body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
a{text-decoration:none;color:var(--color-primary-text)}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:2px}
img{max-width:100%;height:auto}

/* Nav */
.site-nav{background:var(--surface-nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.75rem clamp(1rem,5vw,3rem);gap:1rem;flex-wrap:wrap}
.site-nav .brand{font-weight:800;font-size:1.1rem;color:#fff;letter-spacing:-.02em}
.site-nav .brand:hover{opacity:.9;text-decoration:none}
.site-nav .brand:focus-visible{outline-color:#fff}
.site-nav .nav-links{display:flex;gap:1rem;align-items:center;font-size:.875rem;flex-wrap:wrap}
.site-nav .nav-links a{color:rgba(255,255,255,.78);transition:color .12s}
.site-nav .nav-links a:hover{color:#fff;text-decoration:none}
.site-nav .nav-links a:focus-visible{outline-color:#fff}

/* Shop hero */
.shop-hero{background:var(--hero-gradient);color:#fff;text-align:center;padding:clamp(2.5rem,7vw,5.5rem) clamp(1rem,6vw,4rem)}
.shop-hero h1{font-size:clamp(1.85rem,4vw+.5rem,3.75rem);font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-bottom:.5rem}
.shop-hero .tagline{font-size:clamp(.95rem,1.5vw+.2rem,1.3rem);opacity:.85;font-style:italic;line-height:1.45}
.shop-hero .cta{display:inline-block;background:#fff;color:var(--color-primary-strong);padding:.55rem 1.6rem;border-radius:100px;font-size:.9rem;font-weight:700;margin-top:1.5rem;transition:background .15s}
.shop-hero .cta:hover{background:rgba(255,255,255,.88);text-decoration:none}

/* Featured strip */
.featured{width:100%;max-width:82rem;margin:0 auto;padding:2.5rem clamp(1rem,4vw,3rem) 0}
.featured h2{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.25rem}
.featured-grid{display:grid;gap:.875rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,11.5rem),1fr))}

/* Catalog layout */
.catalog-wrap{width:100%;max-width:82rem;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem);display:grid;gap:1.75rem;grid-template-columns:1fr}
@media(min-width:48rem){.catalog-wrap{grid-template-columns:15.5rem 1fr}}

/* Filter sidebar */
.filter-form{background:var(--surface-card);border:1.5px solid var(--border-default);border-radius:.875rem;padding:1.4rem;font-size:.875rem;position:sticky;top:1rem;align-self:start;box-shadow:var(--shadow-1)}
.filter-form h2{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.25rem}
.filter-form label{display:block;font-weight:600;font-size:.8rem;margin:.875rem 0 .3rem;color:var(--text-strong)}
.filter-form input,.filter-form select{width:100%;padding:.45rem .65rem;font:inherit;border:1.5px solid var(--border-default);border-radius:.45rem;background:var(--surface-page);color:var(--text-strong);font-size:.85rem;transition:border-color .15s}
.filter-form input:focus,.filter-form select:focus{outline:none;border-color:var(--color-primary)}
.filter-form .price-row{display:flex;gap:.5rem}
.filter-form .price-row input{width:0;flex:1}
.filter-form .checkbox-row{display:flex;align-items:center;gap:.5rem;margin:.875rem 0}
.filter-form .checkbox-row input{width:auto;accent-color:var(--color-primary)}
.filter-btn{display:block;width:100%;margin-top:1rem;padding:.55rem;background:var(--color-primary);color:var(--text-on-primary);border:none;border-radius:.45rem;font:inherit;font-weight:700;cursor:pointer;font-size:.875rem;transition:background .15s}
.filter-btn:hover{background:var(--color-primary-strong)}
.filter-clear{display:block;text-align:center;margin-top:.5rem;font-size:.8rem;color:var(--text-muted)}

/* Sort bar */
.sort-bar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem;font-size:.8rem}
.sort-bar span{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.sort-bar a{padding:.25rem .7rem;border:1.5px solid var(--border-default);border-radius:100px;color:var(--text-strong);transition:background .12s,border-color .12s,color .12s}
.sort-bar a.active,.sort-bar a:hover{background:var(--color-primary);color:var(--text-on-primary);border-color:var(--color-primary);text-decoration:none}

/* Product grid */
.product-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.product-card{background:var(--surface-card);border:1.5px solid var(--border-default);border-radius:.875rem;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:var(--shadow-1)}
.product-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--border-accent)}
.product-card a{text-decoration:none;color:var(--text-strong);display:flex;flex-direction:column;flex:1}
.product-card a:hover{text-decoration:none}
.pcard-thumb{height:11rem;display:flex;align-items:center;justify-content:center;font-size:3.5rem;font-weight:800;color:#fff;user-select:none;flex-shrink:0}
.pcard-body{padding:.9rem 1rem;flex:1;display:flex;flex-direction:column;gap:.2rem}
.pcard-name{font-weight:700;font-size:.95rem;line-height:1.35;color:var(--text-strong)}
.pcard-price{font-size:1.05rem;font-weight:800;color:var(--color-primary-text);font-variant-numeric:tabular-nums;margin-top:.1rem}
.pcard-stock{font-size:.75rem;font-weight:600;color:var(--color-danger);margin-top:.2rem}
.pcard-nostock{font-size:.75rem;color:var(--text-muted);margin-top:.2rem}

/* Pagination */
.pagination{display:flex;gap:.375rem;flex-wrap:wrap;align-items:center;margin-top:2rem;font-size:.875rem}
.pagination a,.pagination span{padding:.3rem .65rem;border:1.5px solid var(--border-default);border-radius:.45rem;color:var(--text-strong);min-width:2.25rem;text-align:center;transition:background .12s,border-color .12s,color .12s}
.pagination a:hover{background:var(--color-primary);color:var(--text-on-primary);border-color:var(--color-primary);text-decoration:none}
.pagination .cur{background:var(--color-primary);color:var(--text-on-primary);border-color:var(--color-primary);font-weight:700}
.pagination .dots{border-color:transparent;color:var(--text-muted)}
.pager-info{font-size:.8rem;color:var(--text-muted);margin-top:.5rem}

/* Empty state */
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text-muted)}
.empty-state p{font-size:1.05rem;margin-bottom:1rem}
.empty-state a{color:var(--color-primary-text)}

/* Product detail */
.product-detail{width:100%;max-width:58rem;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem)}
.detail-breadcrumb{font-size:.85rem;color:var(--text-muted);margin-bottom:2rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.detail-breadcrumb a{color:var(--text-muted)}
.detail-breadcrumb a:hover{color:var(--color-primary-text);text-decoration:none}
.detail-breadcrumb .sep{color:var(--border-default);font-size:1.1rem}
.detail-layout{display:grid;gap:2.5rem;grid-template-columns:1fr}
@media(min-width:42rem){.detail-layout{grid-template-columns:1.1fr 1fr}}
.detail-image{border-radius:1rem;overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:6rem;font-weight:800;color:#fff;user-select:none;min-height:14rem}
.detail-info{}
.product-detail h1{font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:.5rem}
.detail-price{font-size:2.1rem;font-weight:800;color:var(--color-primary-text);font-variant-numeric:tabular-nums;margin:1rem 0}
.detail-meta{font-size:.85rem;color:var(--text-muted);display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.detail-badge{background:var(--color-primary-soft);color:var(--color-primary-text);padding:.2rem .65rem;border-radius:100px;font-weight:600;font-size:.8rem}
.detail-desc{white-space:pre-line;margin:1.25rem 0;line-height:1.75;color:var(--text-strong)}
.detail-stock{font-size:.9rem;font-weight:600;color:var(--color-danger);margin:.5rem 0}
.detail-instock{font-size:.9rem;font-weight:600;color:var(--color-success);margin:.5rem 0}
.add-cart-note{background:var(--color-primary-soft);border:1.5px solid var(--border-accent);border-radius:.75rem;padding:1rem 1.25rem;font-size:.9rem;color:var(--text-strong);margin-top:1.75rem;line-height:1.55}
.add-cart-note a{color:var(--color-link-text)}
.detail-cat{font-size:.875rem;color:var(--text-muted)}

/* Shop info bar */
.shop-info{background:var(--surface-card);border-top:2px solid var(--border-default);padding:1.5rem clamp(1rem,5vw,3rem);font-size:.875rem;color:var(--text-muted);display:flex;gap:1.75rem;flex-wrap:wrap}
.shop-info a{color:var(--color-link-text)}
.shop-info strong{color:var(--text-strong)}

/* Notices */
.err{color:var(--color-danger);font-size:.875rem;margin:.5rem 0;padding:.5rem .875rem;background:var(--color-danger-soft);border-left:3px solid var(--color-danger);border-radius:0 .4rem .4rem 0}
.ok{color:var(--color-success);font-size:.875rem;margin:.5rem 0;padding:.5rem .875rem;background:var(--color-primary-soft);border-left:3px solid var(--color-success);border-radius:0 .4rem .4rem 0}

/* Footer */
.site-footer{border-top:1px solid var(--border-default);padding:1.25rem clamp(1rem,5vw,3rem);text-align:center;font-size:.8rem;color:var(--text-muted)}
.site-footer a{color:var(--text-muted)}
.site-footer a:hover{color:var(--color-primary-text);text-decoration:none}

/* Blog */
.blog-wrap{width:100%;max-width:82rem;margin:0 auto;padding:2.5rem clamp(1rem,4vw,3rem) 3.5rem}
.blog-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:2rem}
.blog-head h1{font-family:var(--font-display);font-weight:var(--fw-display);font-size:clamp(1.75rem,3vw+.25rem,2.5rem);letter-spacing:-.03em}
.blog-head .count{color:var(--text-muted);font-size:.875rem}
.blog-grid{display:grid;gap:1.25rem;grid-template-columns:1fr}
@media(min-width:48rem){.blog-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.post-rows{display:flex;flex-direction:column;gap:1rem}
.post-card{display:flex;flex-direction:column;background:var(--surface-card);border:1.5px solid var(--border-default);border-radius:var(--radius-card,.875rem);overflow:hidden;color:var(--text-strong);box-shadow:var(--shadow-1);transition:transform .18s,box-shadow .18s}
.post-card:hover{text-decoration:none;transform:translateY(-2px);box-shadow:var(--shadow-2)}
.post-card:hover h2{text-decoration:underline;text-underline-offset:3px}
.post-thumb{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;user-select:none;height:16rem;font-size:5rem}
.post-row{flex-direction:row}
.post-row .post-thumb{width:7.5rem;height:auto;min-height:6.5rem;font-size:2.25rem;flex-shrink:0}
.post-body{padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.35rem}
.post-body h2{font-family:var(--font-display);font-weight:var(--fw-display);font-size:1.05rem;line-height:1.3;letter-spacing:-.01em}
.post-lead .post-body h2{font-size:clamp(1.3rem,2vw+.4rem,1.75rem)}
.post-body p{color:var(--text-muted);font-size:.95rem;line-height:1.6}
.post-body small{color:var(--text-muted);font-size:.78rem}
.post-cat{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-primary-text)}
.article{width:100%;max-width:44rem;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem) 3rem}
.article h1{font-family:var(--font-display);font-weight:var(--fw-display);font-size:clamp(2rem,4vw,3rem);letter-spacing:-.03em;line-height:1.1;margin:.5rem 0 1rem;text-wrap:balance}
.article-meta{font-size:.875rem;color:var(--text-muted);margin-bottom:2rem}
.article .post-thumb{height:clamp(12rem,35vw,20rem);font-size:7rem;border-radius:var(--radius-media,1rem);margin-bottom:2rem}
.article p{margin:0 0 1.25rem;line-height:1.75;font-size:1.05rem;white-space:pre-line}
.article .article-lede{font-size:1.2rem;color:var(--text-muted)}
.article h2{font-family:var(--font-display);font-weight:var(--fw-display);font-size:1.5rem;letter-spacing:-.02em;margin:2rem 0 .75rem}
.article-related{max-width:44rem;padding-top:0;padding-bottom:3rem}

/* Boutique layout */
.b-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;padding:1.25rem clamp(1rem,5vw,3rem);border-bottom:1px solid var(--border-default);background:var(--surface-page)}
.b-links{display:flex;gap:1.5rem;align-items:center}
.b-right{justify-content:flex-end}
.b-links a{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.b-links a:hover{color:var(--text-strong);text-decoration:none}
.b-links .b-admin{letter-spacing:0;text-transform:none;opacity:.6}
.b-brand{font-family:var(--font-display);font-size:clamp(1.25rem,2.5vw,1.6rem);color:var(--text-strong);text-align:center}
.b-brand:hover{text-decoration:none}
.b-hero{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--border-default)}
@media(min-width:48rem){.b-hero{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);min-height:28rem}}
.b-hero-text{padding:clamp(2rem,6vw,5rem) clamp(1rem,5vw,3rem);display:flex;flex-direction:column;justify-content:center;gap:1rem}
.b-eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--color-primary-text);font-weight:600}
.b-hero h1{font-family:var(--font-display);font-weight:var(--fw-display);font-size:clamp(2.4rem,4.5vw,4.25rem);line-height:1.05;letter-spacing:var(--ls-hero);text-wrap:balance}
.b-tagline{font-family:var(--font-display);font-style:italic;font-size:1.2rem;color:var(--text-muted)}
.b-cta{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-strong);font-weight:600;margin-top:1rem}
.b-hero-media{display:flex;align-items:center;justify-content:center;min-height:16rem;font-family:var(--font-display);font-size:clamp(5rem,10vw,9rem);color:#fff;user-select:none}
.b-hero-media:hover{text-decoration:none}
.b-hero-plain{background:var(--hero-gradient)}
.b-shop{width:100%;max-width:82rem;margin:0 auto;padding:3.5rem clamp(1rem,4vw,3rem)}
.b-cats{display:flex;justify-content:center;gap:1.75rem;margin-bottom:2.5rem;flex-wrap:wrap}
.b-cats a{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid transparent;padding-bottom:2px}
.b-cats a:hover{color:var(--text-strong);text-decoration:none}
.b-cats a.on{color:var(--text-strong);border-bottom-color:var(--text-strong)}
.b-grid{display:grid;gap:3rem 1.5rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.b-tile{display:flex;flex-direction:column;gap:.75rem;color:var(--text-strong)}
.b-tile:hover{text-decoration:none}
.b-thumb{overflow:hidden}
.b-thumb div{height:var(--thumb-h,18rem);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:5rem;color:#fff;user-select:none;transition:transform .4s ease}
.b-tile:hover .b-thumb div{transform:scale(1.03)}
.b-meta{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.b-name{font-family:var(--font-display);font-size:1.2rem;line-height:1.3}
.b-tile:hover .b-name{text-decoration:underline;text-underline-offset:4px}
.b-price{font-size:.875rem;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.b-sold{font-size:.75rem;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
.b-footer{border-top:1px solid var(--border-default);padding:2rem clamp(1rem,5vw,3rem);display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;font-size:.8rem;color:var(--text-muted)}
[data-style="boutique"] .product-detail h1{font-family:var(--font-display);font-weight:var(--fw-display)}
[data-style="boutique"] .detail-image{border-radius:0;font-family:var(--font-display)}

/* Market layout */
.m-bar{background:var(--surface-card);border-bottom:1px solid var(--border-default);padding:.75rem clamp(1rem,5vw,3rem);display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.m-search{display:flex;gap:.4rem;flex:1 1 18rem}
.m-search input{flex:1;min-width:0;padding:.5rem .75rem;font:inherit;font-size:.9rem;border:1.5px solid var(--border-default);border-radius:.375rem;background:var(--surface-page);color:var(--text-strong)}
.m-search input:focus{outline:none;border-color:var(--color-primary)}
.m-search button{border:none;border-radius:.375rem;background:var(--color-primary);color:var(--text-on-primary);font:inherit;font-weight:700;font-size:.85rem;padding:0 1rem;cursor:pointer}
.m-search button:hover{background:var(--color-primary-strong)}
.m-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.m-chips a{padding:.25rem .75rem;border:1.5px solid var(--border-default);border-radius:100px;font-size:.8rem;color:var(--text-strong)}
.m-chips a span{color:var(--text-muted);font-size:.72rem}
.m-chips a:hover{border-color:var(--color-primary);text-decoration:none}
.m-chips a.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--text-on-primary)}
.m-chips a.on span{color:inherit;opacity:.8}
.m-main{width:100%;max-width:82rem;margin:0 auto;padding:1.5rem clamp(1rem,4vw,3rem) 2.5rem;display:flex;flex-direction:column;gap:1.75rem}
.m-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.875rem}
.m-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.5rem}
.m-head .sort-bar{margin-bottom:.875rem}
.m-grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr))}
[data-style="market"] .pcard-thumb{height:var(--thumb-h,8.5rem);font-size:2.5rem;position:relative}
[data-style="market"] .pcard-body{padding:.65rem .75rem}
[data-style="market"] .pcard-name{font-size:var(--fs-card-title,.875rem)}
[data-style="market"] .pcard-price{font-size:.95rem}
.m-badge{position:absolute;top:.5rem;left:.5rem;background:var(--color-cta);color:#fff;font-size:.65rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .5rem;border-radius:100px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
{{end}}
