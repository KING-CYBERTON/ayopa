{{define "setup"}}{{template "head" .}}
<main class="auth">
<div class="auth-box">
<div class="card">
<h1>Set up {{.Shop}}</h1>
{{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
{{if .Token}}
<p style="margin-top:var(--space-2);font-size:.9rem">Choose a password for <b>{{.Email}}</b>.</p>
<form method="post" action="/admin/setup">
<input type="hidden" name="token" value="{{.Token}}">
<label for="password">Password</label>
<input id="password" name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password" aria-describedby="pw-hint">
<span class="hint" id="pw-hint">At least 10 characters.</span>
<label for="confirm">Repeat password</label>
<input id="confirm" name="confirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password">
<button class="btn" type="submit">Save and continue</button>
</form>
{{end}}
</div>
</div>
</main>
{{template "foot" .}}{{end}}
