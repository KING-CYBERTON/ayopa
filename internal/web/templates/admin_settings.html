{{define "admin_settings"}}{{template "head" .}}
{{template "admin_bar" .}}
<main class="admin-main">
<div class="page-head"><h1>Shop settings</h1></div>
{{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
{{if .Notice}}<p class="ok" role="status">{{.Notice}}</p>{{end}}
<form class="card narrow" method="post" action="/admin/settings">
<fieldset>
  <legend>Identity</legend>
  <label for="tagline">Tagline <small>(max 140 characters)</small></label>
  <input id="tagline" name="tagline" type="text" value="{{.Profile.Tagline}}" maxlength="140">
  <label for="description">Description <small>(max 600 characters)</small></label>
  <textarea id="description" name="description" rows="4" maxlength="600">{{.Profile.Description}}</textarea>
</fieldset>
<fieldset>
  <legend>Contact</legend>
  <div class="form-row">
    <div>
      <label for="contact_email">Contact email</label>
      <input id="contact_email" name="contact_email" type="email" value="{{.Profile.ContactEmail}}" maxlength="254">
    </div>
    <div>
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" value="{{.Profile.Phone}}" maxlength="30">
    </div>
  </div>
  <label for="address">Address <small>(max 300 characters)</small></label>
  <textarea id="address" name="address" rows="2" maxlength="300">{{.Profile.Address}}</textarea>
  <label for="opening_hours">Opening hours <small>(max 300 characters)</small></label>
  <textarea id="opening_hours" name="opening_hours" rows="2" maxlength="300">{{.Profile.OpeningHours}}</textarea>
</fieldset>
<fieldset>
  <legend>Currency</legend>
  <label for="currency">Prices displayed in</label>
  <select id="currency" name="currency">
    {{range $c := currencies}}
    <option value="{{$c}}"{{if eq $c $.Profile.Currency}} selected{{end}}>{{$c}}</option>
    {{end}}
  </select>
</fieldset>
<div class="form-actions"><button class="btn" type="submit">Save settings</button></div>
</form>
</main>
{{template "foot" .}}{{end}}
