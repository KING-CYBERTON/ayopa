{{define "dashboard"}}{{template "head" .}}
{{template "admin_bar" .}}
<main class="admin-main">
<div class="page-head">
  <h2>Notes</h2>
  <a class="btn" href="/admin/products/new">+ New product</a>
</div>
<section class="card">
<form method="post" action="/admin/notes">
<label for="body" style="margin-top:0">New note</label>
<textarea id="body" name="body" rows="3" required maxlength="2000"></textarea>
<div class="form-actions" style="margin-top:var(--space-3)"><button class="btn" type="submit">Add note</button></div>
</form>
{{if .Notes}}
<ul class="notes">
{{range .Notes}}<li><div class="body">{{.Body}}</div><small>{{.Author}} · {{.CreatedAt.UTC.Format "2006-01-02 15:04"}} UTC</small></li>
{{end}}
</ul>
{{else}}<p class="muted" style="margin-top:var(--space-4)">No notes yet.</p>{{end}}
</section>
</main>
{{template "foot" .}}{{end}}
