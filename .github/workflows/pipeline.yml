name: pipeline
on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ayopa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./... -race
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ayopa_test?sslmode=disable
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
        working-directory: infra

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ayopa-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ayopa-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Ship deploy files and run deploy
        run: |
          aws s3 sync deploy/ "s3://${{ vars.ARTIFACT_BUCKET }}/deploy/" --delete --exclude "caddy/*"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=ayopa-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"aws s3 sync s3://${{ vars.ARTIFACT_BUCKET }}/deploy /opt/ayopa --region $AWS_REGION\",\"chmod +x /opt/ayopa/deploy.sh\",\"/opt/ayopa/deploy.sh ${{ github.sha }}\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 6 --retry-connrefused "https://${{ vars.BASE_DOMAIN }}/healthz"