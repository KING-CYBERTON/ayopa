name: pipeline

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ayopa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - name: Tests
        run: go test ./... -race
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ayopa_test?sslmode=disable

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format and validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/ayopa-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/ayopa-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Upload deploy files and migrations
        run: |
          aws s3 sync deploy/ "s3://${{ vars.ARTIFACT_BUCKET }}/deploy/" --delete --exclude "caddy/*"
          aws s3 sync migrations/ "s3://${{ vars.ARTIFACT_BUCKET }}/migrations/" --delete

      - name: Deploy via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ayopa-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          PARAMS=$(jq -n \
            --arg bucket "${{ vars.ARTIFACT_BUCKET }}" \
            --arg region "$AWS_REGION" \
            --arg sha "${{ github.sha }}" \
            '{commands: [
              "aws s3 sync s3://\($bucket)/deploy /opt/ayopa --region \($region)",
              "bash /opt/ayopa/deploy.sh \($sha)"
            ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ]

      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 10 --retry-all-errors --retry-connrefused \
            "https://${{ vars.BASE_DOMAIN }}/healthz"